[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "lcycode"
version = "0.2.0"
description = "LCYcode.ai — offline-first agentic coding agent"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.29",
    "httpx>=0.27",
    "pydantic>=2.7",
]

[project.scripts]
lcycode = "main:main"

[tool.setuptools.packages.find]
include = ["lcycode*"]
