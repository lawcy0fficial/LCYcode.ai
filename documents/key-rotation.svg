<svg width="900" height="360" viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg">
  <rect width="900" height="360" fill="#0B0E14"/>
  <text x="450" y="36" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="16" font-weight="700" fill="#E6E9EF">key_manager.py — rotation, cooldown &amp; placeholder-key filtering</text>

  <g font-family="'JetBrains Mono',monospace" font-size="12">
    <circle cx="200" cy="180" r="34" fill="rgba(61,220,151,0.15)" stroke="#3DDC97" stroke-width="2">
      <animate attributeName="stroke-width" values="2;5;2" dur="3s" begin="0s" repeatCount="indefinite"/>
    </circle>
    <text x="200" y="184" text-anchor="middle" fill="#3DDC97">key 1</text>

    <circle cx="320" cy="120" r="34" fill="rgba(61,220,151,0.15)" stroke="#3DDC97" stroke-width="2">
      <animate attributeName="stroke-width" values="2;5;2" dur="3s" begin="1s" repeatCount="indefinite"/>
    </circle>
    <text x="320" y="124" text-anchor="middle" fill="#3DDC97">key 2</text>

    <circle cx="320" cy="240" r="34" fill="rgba(255,107,107,0.12)" stroke="#FF6B6B" stroke-width="2" stroke-dasharray="4 3"/>
    <text x="320" y="238" text-anchor="middle" fill="#FF6B6B">key 3</text>
    <text x="320" y="254" text-anchor="middle" fill="#FF6B6B" font-size="9">cooldown 60s</text>

    <circle cx="440" cy="180" r="34" fill="rgba(131,142,166,0.1)" stroke="#4a5268" stroke-width="2" stroke-dasharray="2 4"/>
    <text x="440" y="178" text-anchor="middle" fill="#4a5268" font-size="10">REPLACE_</text>
    <text x="440" y="191" text-anchor="middle" fill="#4a5268" font-size="10">WITH_...</text>
    <text x="440" y="228" text-anchor="middle" fill="#4a5268" font-size="9">filtered at load — never rotated in</text>

    <circle r="8" fill="#FFB454">
      <animateMotion dur="4s" repeatCount="indefinite" path="M200,180 L320,120 L200,180 L320,240 L200,180"/>
    </circle>
  </g>

  <rect x="600" y="120" width="240" height="120" rx="10" fill="#10141E" stroke="#232938"/>
  <text x="720" y="148" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="13" fill="#E6E9EF" font-weight="700">no real key configured?</text>
  <text x="720" y="172" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11" fill="#838EA6">ring is empty →</text>
  <text x="720" y="192" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11" fill="#838EA6">provider raises "no keys configured"</text>
  <text x="720" y="212" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11" fill="#3DDC97">router falls through cleanly →</text>

  <text x="450" y="310" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11.5" fill="#838EA6">a dead key never stalls the agent · a fake placeholder key never fires a real API call</text>
</svg>
