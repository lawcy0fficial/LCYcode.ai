<svg width="1000" height="480" viewBox="0 0 1000 480" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="cbg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#151A26"/><stop offset="100%" stop-color="#0B0E14"/>
    </radialGradient>
  </defs>
  <rect width="1000" height="480" fill="url(#cbg)"/>
  <text x="500" y="40" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="18" font-weight="700" fill="#E6E9EF">✦ feature constellation ✦</text>

