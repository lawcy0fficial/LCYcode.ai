<svg width="820" height="320" viewBox="0 0 820 320" xmlns="http://www.w3.org/2000/svg">
  <rect width="820" height="320" fill="#0B0E14"/>
  <text x="410" y="36" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="16" font-weight="700" fill="#E6E9EF">docker compose — HEALTHCHECK against /api/health</text>

  <rect x="60" y="100" width="200" height="90" rx="10" fill="#10141E" stroke="#2496ED" stroke-width="2"/>
  <text x="160" y="132" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="13" fill="#2496ED" font-weight="700">lcycode container</text>
  <text x="160" y="154" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="10.5" fill="#838EA6">FastAPI + agent loop</text>
  <text x="160" y="170" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="10.5" fill="#838EA6">workspace/ volume mounted</text>

  <line x1="260" y1="145" x2="360" y2="145" stroke="#3DDC97" stroke-width="2"/>
  <circle r="5" fill="#3DDC97"><animateMotion dur="1.6s" repeatCount="indefinite" path="M260,145 L360,145"/></circle>
  <text x="310" y="130" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="9.5" fill="#838EA6">GET /api/health</text>

  <rect x="360" y="100" width="200" height="90" rx="10" fill="#10141E" stroke="#7C5CFF" stroke-width="2"/>
  <text x="460" y="132" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="13" fill="#7C5CFF" font-weight="700">Ollama</text>
  <text x="460" y="154" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="10.5" fill="#838EA6">host.docker.internal:11434</text>
  <text x="460" y="170" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="10.5" fill="#838EA6">or its own container</text>

  <line x1="560" y1="130" x2="640" y2="115" stroke="#3DDC97" stroke-width="2"/>
  <text x="670" y="112" font-family="'JetBrains Mono',monospace" font-size="12" fill="#3DDC97">reachable → exit 0 · healthy</text>

  <line x1="560" y1="160" x2="640" y2="175" stroke="#FF6B6B" stroke-width="2"/>
  <text x="670" y="180" font-family="'JetBrains Mono',monospace" font-size="12" fill="#FF6B6B">unreachable → exit 1 · unhealthy</text>

  <text x="410" y="260" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11.5" fill="#838EA6">verified against a real running server in both directions — the docker build itself was not run in this sandbox (no Docker available)</text>
</svg>
