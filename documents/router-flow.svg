<svg width="900" height="360" viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="arw" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#3DDC97"/></marker>
  </defs>
  <rect width="900" height="360" fill="#0B0E14"/>

  <rect x="30" y="150" width="190" height="70" rx="10" fill="#10141E" stroke="#7C5CFF" stroke-width="2"/>
  <text x="125" y="180" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="13" fill="#7C5CFF" font-weight="700">key.json</text>
  <text x="125" y="200" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="10.5" fill="#838EA6">offline_only: true</text>

  <line x1="220" y1="185" x2="290" y2="185" stroke="#3DDC97" stroke-width="2" marker-end="url(#arw)"/>
  <circle r="4" fill="#3DDC97"><animateMotion dur="1.8s" repeatCount="indefinite" path="M220,185 L290,185"/></circle>

  <rect x="300" y="130" width="230" height="110" rx="10" fill="#10141E" stroke="#3DDC97" stroke-width="2"/>
  <text x="415" y="160" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="13" fill="#3DDC97" font-weight="700">KeyManager.routing()</text>
  <text x="415" y="182" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="10.5" fill="#C8D0E0">hard-overrides</text>
  <text x="415" y="198" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="10.5" fill="#C8D0E0">routing.order → ["ollama"]</text>
  <text x="415" y="218" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="10" fill="#4a5268">(ignores per-call requests too)</text>

  <line x1="530" y1="185" x2="600" y2="185" stroke="#3DDC97" stroke-width="2" marker-end="url(#arw)"/>
  <circle r="4" fill="#FFB454"><animateMotion dur="1.8s" begin="0.4s" repeatCount="indefinite" path="M530,185 L600,185"/></circle>

  <rect x="610" y="60" width="260" height="70" rx="10" fill="rgba(61,220,151,0.1)" stroke="#3DDC97" stroke-width="2"/>
  <text x="740" y="88" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="13" fill="#3DDC97" font-weight="700">✓ Ollama</text>
  <text x="740" y="108" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="10.5" fill="#838EA6">every stage, every call, free</text>

  <rect x="610" y="150" width="260" height="140" rx="10" fill="rgba(255,107,107,0.06)" stroke="#FF6B6B" stroke-width="1.5" stroke-dasharray="5 4">
    <animate attributeName="opacity" values="0.35;0.7;0.35" dur="3s" repeatCount="indefinite"/>
  </rect>
  <text x="740" y="175" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="12" fill="#FF6B6B" font-weight="700">✕ never considered</text>
  <text x="740" y="200" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11" fill="#838EA6">OpenRouter</text>
  <text x="740" y="222" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11" fill="#838EA6">DeepSeek</text>
  <text x="740" y="244" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11" fill="#838EA6">Grok</text>
  <text x="740" y="270" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="9.5" fill="#4a5268">only reachable if offline_only:false</text>

  <text x="450" y="320" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11" fill="#838EA6">GUI pipeline rail / CLI print the provider tag that actually answered each stage — a cloud tag while offline_only is on is a bug, not a feature</text>
</svg>
