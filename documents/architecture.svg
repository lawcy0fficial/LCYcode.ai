<svg width="960" height="640" viewBox="0 0 960 640" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="lyr1" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#7C5CFF"/><stop offset="100%" stop-color="#5B3FE0"/></linearGradient>
    <linearGradient id="lyr2" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#3DDC97"/><stop offset="100%" stop-color="#2AB57C"/></linearGradient>
    <linearGradient id="lyr3" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#FFB454"/><stop offset="100%" stop-color="#E89A38"/></linearGradient>
    <linearGradient id="lyr4" x1="0" y1="0" x2="1" y2="0"><stop offset="0%" stop-color="#FF6B6B"/><stop offset="100%" stop-color="#E24F4F"/></linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#3DDC97"/></marker>
    <path id="p1" d="M480,110 L480,150"/>
    <path id="p2" d="M480,240 L480,280"/>
    <path id="p3" d="M480,370 L480,410"/>
    <path id="p4" d="M480,500 L480,540"/>
  </defs>
  <rect width="960" height="640" fill="#0B0E14"/>

  <!-- Layer 1: Interfaces -->
  <rect x="80" y="30" width="800" height="70" rx="12" fill="url(#lyr1)" opacity="0.15" stroke="#7C5CFF" stroke-width="1.5"/>
  <text x="110" y="58" font-family="'JetBrains Mono',monospace" font-size="13" font-weight="700" fill="#7C5CFF">INTERFACES</text>
  <text x="110" y="80" font-family="'JetBrains Mono',monospace" font-size="12" fill="#C8D0E0">Web GUI (pipeline rail · live diff view)   ·   CLI chat   ·   SSE   ·   WebSocket (multi-session)</text>

  <!-- Layer 2: API -->
  <rect x="80" y="160" width="800" height="70" rx="12" fill="url(#lyr2)" opacity="0.15" stroke="#3DDC97" stroke-width="1.5"/>
  <text x="110" y="188" font-family="'JetBrains Mono',monospace" font-size="13" font-weight="700" fill="#3DDC97">API LAYER — FastAPI</text>
  <text x="110" y="210" font-family="'JetBrains Mono',monospace" font-size="12" fill="#C8D0E0">/api/chat · /chat/continue · /chat/cancel · /sessions · /health · /ws/chat</text>

  <!-- Layer 3: Agent core -->
  <rect x="80" y="290" width="800" height="80" rx="12" fill="url(#lyr3)" opacity="0.15" stroke="#FFB454" stroke-width="1.5"/>
  <text x="110" y="318" font-family="'JetBrains Mono',monospace" font-size="13" font-weight="700" fill="#FFB454">AGENT CORE</text>
  <text x="110" y="340" font-family="'JetBrains Mono',monospace" font-size="12" fill="#C8D0E0">agent_loop.py (Describe→Plan→Execute→Review)  ·  session.py  ·  run_registry.py</text>
  <text x="110" y="358" font-family="'JetBrains Mono',monospace" font-size="12" fill="#C8D0E0">compaction.py (bounds long sessions)  ·  prompts.py  ·  json_utils.py</text>

  <!-- Layer 4: Tools + Providers side by side -->
  <rect x="80" y="420" width="380" height="80" rx="12" fill="url(#lyr4)" opacity="0.15" stroke="#FF6B6B" stroke-width="1.5"/>
  <text x="110" y="448" font-family="'JetBrains Mono',monospace" font-size="13" font-weight="700" fill="#FF6B6B">15 TOOLS (workspace-sandboxed)</text>
  <text x="110" y="470" font-family="'JetBrains Mono',monospace" font-size="11.5" fill="#C8D0E0">fs · run_shell (guarded)</text>
  <text x="110" y="486" font-family="'JetBrains Mono',monospace" font-size="11.5" fill="#C8D0E0">search · git · tests/lint</text>

  <rect x="500" y="420" width="380" height="80" rx="12" fill="url(#lyr1)" opacity="0.15" stroke="#7C5CFF" stroke-width="1.5"/>
  <text x="530" y="448" font-family="'JetBrains Mono',monospace" font-size="13" font-weight="700" fill="#7C5CFF">PROVIDER ROUTER</text>
  <text x="530" y="470" font-family="'JetBrains Mono',monospace" font-size="11.5" fill="#C8D0E0">offline_only ⇒ hard-override [ollama]</text>
  <text x="530" y="486" font-family="'JetBrains Mono',monospace" font-size="11.5" fill="#C8D0E0">else try-order incl. cloud fallback</text>

  <!-- Layer 5: models -->
  <rect x="80" y="550" width="380" height="60" rx="12" fill="#10141E" stroke="#232938"/>
  <text x="270" y="586" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="13" fill="#3DDC97">workspace/ (sandboxed FS)</text>

  <rect x="500" y="550" width="380" height="60" rx="12" fill="#10141E" stroke="#232938"/>
  <text x="690" y="578" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="13" fill="#E6E9EF">Ollama (local, free, default)</text>
  <text x="690" y="596" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="10.5" fill="#838EA6">OpenRouter / DeepSeek / Grok — optional fallback</text>

  <!-- connectors -->
  <line x1="480" y1="100" x2="480" y2="158" stroke="#3DDC97" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="480" y1="230" x2="480" y2="288" stroke="#3DDC97" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="290" y1="370" x2="270" y2="418" stroke="#3DDC97" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="670" y1="370" x2="690" y2="418" stroke="#3DDC97" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="270" y1="500" x2="270" y2="548" stroke="#3DDC97" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="690" y1="500" x2="690" y2="548" stroke="#3DDC97" stroke-width="2" marker-end="url(#arrow)"/>

  <!-- animated flow dots -->
  <circle r="5" fill="#3DDC97"><animateMotion dur="2.4s" repeatCount="indefinite" path="M480,100 L480,158"/></circle>
  <circle r="5" fill="#3DDC97"><animateMotion dur="2.4s" begin="0.6s" repeatCount="indefinite" path="M480,230 L480,288"/></circle>
  <circle r="5" fill="#3DDC97"><animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite" path="M290,370 L270,418"/></circle>
  <circle r="5" fill="#3DDC97"><animateMotion dur="2.4s" begin="1.2s" repeatCount="indefinite" path="M670,370 L690,418"/></circle>
  <circle r="5" fill="#FFB454"><animateMotion dur="2.4s" begin="1.8s" repeatCount="indefinite" path="M270,500 L270,548"/></circle>
  <circle r="5" fill="#7C5CFF"><animateMotion dur="2.4s" begin="1.8s" repeatCount="indefinite" path="M690,500 L690,548"/></circle>
</svg>
