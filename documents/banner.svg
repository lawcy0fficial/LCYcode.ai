<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0B0E14"/>
      <stop offset="55%" stop-color="#10141E"/>
      <stop offset="100%" stop-color="#151A26"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7C5CFF"/>
      <stop offset="45%" stop-color="#3DDC97"/>
      <stop offset="100%" stop-color="#FFB454">
        <animate attributeName="offset" values="1;0.6;1" dur="6s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>
    <radialGradient id="glowV" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7C5CFF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#7C5CFF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowM" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3DDC97" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#3DDC97" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#232938" stroke-width="0.6" opacity="0.5"/>
    </pattern>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>

  <circle cx="140" cy="60" r="160" fill="url(#glowV)">
    <animate attributeName="r" values="140;180;140" dur="7s" repeatCount="indefinite"/>
  </circle>
  <circle cx="1080" cy="250" r="160" fill="url(#glowM)">
    <animate attributeName="r" values="150;190;150" dur="8s" repeatCount="indefinite"/>
  </circle>

  <!-- floating particles -->
  <g fill="#3DDC97">
    <circle cx="120" cy="230" r="2.4"><animate attributeName="cy" values="230;180;230" dur="5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;1;0.2" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="980" cy="60" r="2.4" fill="#7C5CFF"><animate attributeName="cy" values="60;100;60" dur="6.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.2;1;0.2" dur="6.5s" repeatCount="indefinite"/></circle>
    <circle cx="640" cy="40" r="2" fill="#FFB454"><animate attributeName="cy" values="40;75;40" dur="4.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.15;0.9;0.15" dur="4.5s" repeatCount="indefinite"/></circle>
    <circle cx="300" cy="255" r="2" fill="#FF6B6B"><animate attributeName="cy" values="255;220;255" dur="5.5s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.15;0.9;0.15" dur="5.5s" repeatCount="indefinite"/></circle>
    <circle cx="1120" cy="150" r="2.2" fill="#3DDC97"><animate attributeName="cy" values="150;190;150" dur="6s" repeatCount="indefinite"/><animate attributeName="opacity" values="0.15;0.9;0.15" dur="6s" repeatCount="indefinite"/></circle>
  </g>

  <!-- scanning line -->
  <rect x="0" y="0" width="3" height="300" fill="#3DDC97" opacity="0.55">
    <animate attributeName="x" values="0;1197;0" dur="9s" repeatCount="indefinite"/>
  </rect>

  <!-- title -->
  <text x="600" y="140" text-anchor="middle" font-family="'JetBrains Mono','Fira Code',monospace" font-size="64" font-weight="700" fill="url(#titleGrad)">LCYcode.ai</text>

  <!-- terminal cursor -->
  <rect x="838" y="102" width="16" height="46" fill="#3DDC97">
    <animate attributeName="opacity" values="1;0;1" dur="1.1s" repeatCount="indefinite"/>
  </rect>

  <text x="600" y="180" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="17" fill="#838EA6" letter-spacing="0.5">an offline-first, Ollama-native agentic coding agent</text>

  <!-- pipeline chips -->
  <g font-family="'JetBrains Mono',monospace" font-size="13" font-weight="600">
    <g>
      <rect x="300" y="220" width="118" height="34" rx="17" fill="none" stroke="#7C5CFF" stroke-width="1.4"/>
      <text x="359" y="242" text-anchor="middle" fill="#7C5CFF">DESCRIBE</text>
    </g>
    <text x="428" y="242" fill="#3DDC97" font-size="16">→</text>
    <g>
      <rect x="446" y="220" width="90" height="34" rx="17" fill="none" stroke="#3DDC97" stroke-width="1.4"/>
      <text x="491" y="242" text-anchor="middle" fill="#3DDC97">PLAN</text>
    </g>
    <text x="546" y="242" fill="#FFB454" font-size="16">→</text>
    <g>
      <rect x="564" y="220" width="112" height="34" rx="17" fill="none" stroke="#FFB454" stroke-width="1.4"/>
      <text x="620" y="242" text-anchor="middle" fill="#FFB454">EXECUTE</text>
    </g>
    <text x="686" y="242" fill="#FF6B6B" font-size="16">→</text>
    <g>
      <rect x="704" y="220" width="102" height="34" rx="17" fill="none" stroke="#FF6B6B" stroke-width="1.4"/>
      <text x="755" y="242" text-anchor="middle" fill="#FF6B6B">REVIEW</text>
    </g>
    <g>
      <animateTransform attributeName="transform" type="translate" values="0,0;3,0;0,0" dur="2s" repeatCount="indefinite"/>
    </g>
  </g>
</svg>
