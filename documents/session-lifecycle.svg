<svg width="1000" height="260" viewBox="0 0 1000 260" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="am" markerWidth="9" markerHeight="9" refX="6" refY="3" orient="auto"><path d="M0,0 L6,3 L0,6 Z" fill="#3DDC97"/></marker>
  </defs>
  <rect width="1000" height="260" fill="#0B0E14"/>
  <text x="500" y="34" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="16" font-weight="700" fill="#E6E9EF">session lifecycle</text>

  <g font-family="'JetBrains Mono',monospace" font-size="12" font-weight="700" text-anchor="middle">
    <rect x="40" y="90" width="140" height="60" rx="10" fill="rgba(124,92,255,0.12)" stroke="#7C5CFF" stroke-width="2"/>
    <text x="110" y="124" fill="#7C5CFF">new</text>

    <rect x="230" y="90" width="140" height="60" rx="10" fill="rgba(61,220,151,0.12)" stroke="#3DDC97" stroke-width="2"/>
    <text x="300" y="124" fill="#3DDC97">running</text>

    <rect x="420" y="90" width="140" height="60" rx="10" fill="rgba(255,180,84,0.12)" stroke="#FFB454" stroke-width="2"/>
    <text x="490" y="118" fill="#FFB454">pending</text>
    <text x="490" y="134" font-size="9" fill="#838EA6">(cap hit / cancelled)</text>

    <rect x="610" y="90" width="140" height="60" rx="10" fill="rgba(61,220,151,0.12)" stroke="#3DDC97" stroke-width="2"/>
    <text x="680" y="124" fill="#3DDC97">running</text>

    <rect x="800" y="90" width="160" height="60" rx="10" fill="rgba(255,107,107,0.12)" stroke="#FF6B6B" stroke-width="2"/>
    <text x="880" y="124" fill="#FF6B6B">complete</text>
  </g>

  <line x1="180" y1="120" x2="228" y2="120" stroke="#3DDC97" stroke-width="2" marker-end="url(#am)"/>
  <line x1="370" y1="120" x2="418" y2="120" stroke="#3DDC97" stroke-width="2" marker-end="url(#am)"/>
  <line x1="560" y1="120" x2="608" y2="120" stroke="#3DDC97" stroke-width="2" marker-end="url(#am)"/>
  <text x="585" y="105" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="9.5" fill="#838EA6">continue</text>
  <line x1="750" y1="120" x2="798" y2="120" stroke="#3DDC97" stroke-width="2" marker-end="url(#am)"/>

  <circle r="5" fill="#3DDC97"><animateMotion dur="6s" repeatCount="indefinite" path="M110,150 L110,120 L960,120"/></circle>

  <text x="500" y="210" text-anchor="middle" font-family="'JetBrains Mono',monospace" font-size="11.5" fill="#838EA6">review: complete=false at the iteration cap → pauses to "pending", never errors — GUI shows "Continue building", CLI accepts `continue`</text>
</svg>
